spring.application.name=yield-planner-api

# ── Database (H2 for dev, switch to PostgreSQL in production) ────────────────
# H2 in-memory for easy development without PostgreSQL setup
spring.datasource.url=jdbc:h2:file:./data/crop_yield;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── PostgreSQL (uncomment for production) ────────────────────────────────────
# spring.datasource.url=jdbc:postgresql://localhost:5432/crop_yield
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=yield_user
# spring.datasource.password=yield_pass

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL: org.hibernate.dialect.PostgreSQLDialect

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── JWT Configuration ────────────────────────────────────────────────────────
app.jwt.secret=YieldPlannerSecretKey2026ForJWTTokenSigningMustBeLongEnough256Bits
app.jwt.expiration-ms=86400000

# ── ML Service ───────────────────────────────────────────────────────────────
app.ml-service.url=http://localhost:8000

# ── Weather API ──────────────────────────────────────────────────────────────
app.weather.api-key=${OPENWEATHER_API_KEY:demo}
app.weather.base-url=https://api.openweathermap.org/data/2.5

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000
